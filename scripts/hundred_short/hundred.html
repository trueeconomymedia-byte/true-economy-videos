<!doctype html><html><head><meta charset="utf-8">
<!-- True Economy "WHO GETS WHAT" (hundred) animation style (approved by the user 23 Nov 2026). Driven by hundred_render.js.
     Solid chunks stack on the left one at a time and each flows RIGHT as a ribbon with flowing dashes into its share
     on the right; opens on the finished chart (last share "?%"), rewinds, plays; rotating gold reveal.
     Transparent page: the card paper + printed-ink finish is added by scripts/anim_shared/ink_pipe.py. -->
<style>
@font-face{font-family:'Lora';font-weight:700;src:url('../assets/Lora-Bold.ttf')}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{width:1080px;height:1920px;position:relative}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="stage"><svg id="sv" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const C={blue:'#3670D0',lblue:'#B3C9ED',red:'#D94437',lred:'#F2C4BC',gold:'#FACB3A',ink:'#111111',paper:'#FBF8F1',grey:'#5A554B',line:'#CFC8B8'};
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,p)=>a+(b-a)*p;
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function T(p,x,y,s,size,fill,anchor,w){return el(p,'text',{x,y,'font-family':'Inter','font-weight':w||800,'font-size':size,fill,'text-anchor':anchor||'middle'},s)}
// shared SAFE title zone (same as every Animated Shorts series): baselines 395/490; all content inside x 60-1020
const T1=395,T2=490;
function headline(g,l1,l2,mark,fl){fl=fl||[1,1];   // fl = vertical flip scale of each line (1 = flat, 0 = edge-on) for the rotating reveal
 const hs=86,g1=el(g,'g',{}),g2=el(g,'g',{}),in1=l1.includes(mark),mk=el(in1?g1:g2,'rect',{fill:C.gold});
 const t1=el(g1,'text',{x:540,y:T1,'text-anchor':'middle','font-family':'Lora','font-weight':700,'font-size':hs,fill:C.ink},l1);
 const t2=el(g2,'text',{x:540,y:T2,'text-anchor':'middle','font-family':'Lora','font-weight':700,'font-size':hs,fill:C.ink},l2);
 const w=Math.max(t1.getComputedTextLength(),t2.getComputedTextLength());
 if(w>900){const f=Math.floor(hs*900/w);t1.setAttribute('font-size',f);t2.setAttribute('font-size',f)}
 const tx=in1?t1:t2,line=in1?l1:l2,i0=line.indexOf(mark),fs=+tx.getAttribute('font-size');
 const xs=tx.getStartPositionOfChar(i0).x,xe=tx.getEndPositionOfChar(i0+mark.length-1).x;
 Object.entries({x:xs-6,width:xe-xs+12,y:(in1?T1:T2)-Math.round(fs*.4),height:Math.round(fs*.47)}).forEach(([k,v])=>mk.setAttribute(k,v));
 [[g1,T1],[g2,T2]].forEach(([gg,y],k)=>{const c=y-fs*.3;gg.setAttribute('transform',`translate(0 ${c}) scale(1 ${Math.max(0.001,fl[k]).toFixed(3)}) translate(0 ${-c})`);if(fl[k]<0.02)gg.setAttribute('opacity',0)});
}
// ---- layout (v3, flow style LEFT -> RIGHT, user 22 Nov 2026): a column of 100 blocks (one household each) on the left;
// each group's blocks flow RIGHT as a ribbon with flowing dashes into its share of the bar on the right. The video OPENS
// on the finished chart (the last share hidden as "?%": this is the cover), rewinds quickly to the start, then plays one
// ribbon at a time; the last is the gold reveal, which brings it back to the opening picture (loop).
const XL0=250,XL1=294,XR0=786,XR1=830,Y0=600,Y1=1500,U=(Y1-Y0)/100,LG='#FBE3A0',DG='#C89B12',COLD=1.25;
let D,TL,P;
function BUILD(d){
 D=d;const G=D.groups,last=G[G.length-1];P=[...G.slice(0,-1),...last.split].map(p=>({...p}));
 let n=0,sh=0;P.forEach((p,k)=>{p.a1=Y1-n*U;p.a0=Y1-(n+p.n)*U;p.b1=Y1-sh*U;p.b0=Y1-(sh+p.share)*U;p.i0=n;n+=p.n;sh+=p.share;
  p.gold=k===P.length-1;p.fill=p.gold?LG:p.colour==='red'?C.lred:p.colour==='teal'?'#B2DCCE':C.lblue;p.ink=p.gold?C.gold:p.colour==='red'?C.red:p.colour==='teal'?'#249972':C.blue;   // colours: red, blue (default), teal; the last part is always gold
  p.dash=p.gold?DG:p.ink;
  let s=17+k*31;const R=()=>{s=(s*9301+49297)%233280;return s/233280};const nd=Math.max(4,Math.round(((p.a1-p.a0)+(p.b1-p.b0))/2/8));
  p.ds=[];for(let q=0;q<nd;q++)p.ds.push({u:.08+.84*R(),ph:R(),sp:.85+.3*R(),ln:.035+.035*R()})});
 let t=COLD+0.35;TL={grp:[]};
 P.forEach((p,k)=>{const lastp=k===P.length-1;if(lastp){t-=1.5;TL.hold=t-0.6}   // no wait at the "?%" (user 22 Nov 2026): the last ribbon follows straight on
  TL.grp.push({a:t,land:t+1.9,num:[t+1.8,t+2.7]});t+=lastp?1.9:3.6});
 TL.ans=t;TL.end=t+4.4;
 window.BEATS={total:TL.end,cold:COLD,rewind:[0.05,COLD-0.2,12],ticks:[],patter:[],rolls:[],glides:[],swells:[[TL.grp[0].land,1.2]],
  stacks:TL.grp.map((g,k)=>[g.a-0.42,k===P.length-1?0.6:1.0]),pours:TL.grp.map(g=>[g.a,g.land-g.a]),counts:TL.grp.slice(0,-1).map(g=>[g.num[0],g.num[1]]),
  lands:[[COLD,0.8],...TL.grp.slice(0,-1).map((g,k)=>[g.land,k?0.8:1.0])],notes:[],hold:TL.hold,reveal:TL.ans,
  qa:[0.0,0.5,0.95,TL.grp[0].a+1.0,TL.grp[0].land+1.2,TL.grp[1].land+1.2,TL.grp[2].land+0.9,TL.ans-0.9,TL.ans-0.3,TL.ans+2.5],thumb_ms:33};
}
function setTime(t){FRAME(t)}
function tease(){FRAME(0)}
function answer(){FRAME(TL.end-0.05)}
function FRAME(t){
 const sv=document.getElementById('sv');sv.innerHTML='';const g=el(sv,'g',{});const defs=el(sv,'defs',{});
 const cold=t<COLD,ans=cold?0:prog(t,TL.ans,TL.ans+0.45),nP=P.length;
 // ROTATING REVEAL (user 23 Nov 2026): each title line flips over (edge-on, then back) from the question to the answer,
 // line 2 a beat after line 1; the "?%" flips to the answer the same way
 {const A=TL.ans,rot=k=>eio(prog(t,A+k*0.09,A+k*0.09+0.5)),out=k=>Math.cos(Math.PI/2*Math.min(1,rot(k)*2)),inn=k=>Math.sin(Math.PI/2*Math.max(0,rot(k)*2-1));
  headline(g,...D.headline_q,[out(0),out(1)]);headline(g,...D.headline_a,[inn(0),inn(1)])}
 const z=cold?1.02-0.02*eio(prog(t,0,COLD)):1+0.012*prog(t,COLD,TL.end);   // never completely still
 const W=el(g,'g',{transform:`translate(540 1050) scale(${z}) translate(-540 -1050)`});
 // how far each ribbon has travelled (0..1) and how much of its number shows. Opening: everything is there, then the
 // ribbons run back right -> left, last group first (the rewind), and the play starts from the empty chart.
 const st=P.map((p,k)=>{const tl=TL.grp[k];if(cold){const r0=0.05+(nP-1-k)*0.16,pour=1-eio(prog(t,r0,r0+0.62));return {pour,num:1,numOp:prog(pour,0.85,1),act:pour>0.02,land:prog(pour,0.9,1)}}
  return {pour:eio(prog(t,tl.a,tl.land)),num:eo(prog(t,tl.num[0],tl.num[1])),numOp:eo(prog(t,tl.land-0.15,tl.land+0.3)),act:t>=tl.a-0.45,land:eo(prog(t,tl.land-0.15,tl.land+0.3)),nameOp:eo(prog(t,tl.a-0.45,tl.a-0.05))}});
 // headers and the empty destination bar
 T(W,(XL0+XL1)/2,Y0-28,D.left_label,26,C.grey,'middle',700);T(W,(XR0+XR1)/2,Y0-28,D.right_label,26,C.grey,'middle',700);
 // left column: SOLID chunks that stack one at a time, bottom group first (user 22 Nov 2026: no little blocks)
 P.forEach((p,k)=>{const tl=TL.grp[k],up=cold?prog(st[k].pour,0,0.3):eo(prog(t,tl.a-0.5,tl.a-0.05));if(up<=0)return;
  let x=XL0,w=XL1-XL0;if(p.gold&&!cold&&t>TL.hold&&ans<=0){const pu=0.5-0.5*Math.cos((t-TL.hold)*Math.PI*2);x=XL0-16*pu;w=XL1-XL0+16*pu}   // the last sliver pulses
  const h=(p.a1-p.a0)*up;el(W,'rect',{x,y:(p.a1-h+(k?1:0)).toFixed(2),width:w,height:Math.max(0,h-(k?1:0)).toFixed(2),fill:p.ink})});
 // group names left of their blocks
 P.forEach((p,k)=>{const o=cold?prog(st[k].pour,0.0,0.25):st[k].nameOp;if(o<=0)return;const lg=el(W,'g',{opacity:o});
  let y=(p.a0+p.a1)/2+11;if(k===nP-1)y=Math.min(y,p.a1+2);
  T(lg,XL0-18,y,p.name,30,p.gold?C.ink:p.ink,'end',800)});
 // ribbons with flowing dashes, left -> right
 const xa=XL1,xb=XR0,xm=(xa+xb)/2;
 P.forEach((p,k)=>{const pour=st[k].pour;if(pour<=0)return;const front=xa+(xb-xa)*pour,tl=TL.grp[k];
  const cp=el(defs,'clipPath',{id:'c'+k});el(cp,'rect',{x:xa-2,y:0,width:front-xa+2,height:1920});const rg=el(W,'g',{'clip-path':`url(#c${k})`});
  el(rg,'path',{d:`M${xa} ${p.a0+1} C${xm} ${p.a0+1} ${xm} ${p.b0+1} ${xb} ${p.b0+1} L${xb} ${p.b1-1} C${xm} ${p.b1-1} ${xm} ${p.a1-1} ${xa} ${p.a1-1}Z`,fill:p.fill});
  for(const d of p.ds){const q=cold?(t*0.34*d.sp+d.ph):((t-tl.a)*0.34*d.sp-d.ph);if(q<0)continue;const tt=(q%1)*0.93;
   const ya=p.a0+d.u*(p.a1-p.a0),yb=p.b0+d.u*(p.b1-p.b0);
   const bx=v=>{const m=1-v;return m*m*m*xa+3*m*m*v*xm+3*m*v*v*xm+v*v*v*xb},by=v=>{const m=1-v;return m*m*m*ya+3*m*m*v*ya+3*m*v*v*yb+v*v*v*yb};
   el(rg,'line',{x1:bx(tt).toFixed(1),y1:by(tt).toFixed(1),x2:bx(tt+d.ln).toFixed(1),y2:by(tt+d.ln).toFixed(1),stroke:p.dash,'stroke-width':5,'stroke-linecap':'round',opacity:(Math.min(1,tt/.08,(.93-tt)/.08)*.65).toFixed(2)})}});
 // right bar: each share lands with its big number; the last share is "?%" until the gold reveal
 P.forEach((p,k)=>{const lastp=k===nP-1,lp=st[k].land;
  if(lp>0)el(W,'rect',{x:XR0,y:p.b0+1,width:(XR1-XR0)*lp,height:p.b1-p.b0-2,fill:p.ink});
  const show=lastp?(cold?st[k].numOp:eo(prog(t,TL.hold,TL.hold+0.4))):st[k].numOp;if(show<=0)return;
  const fr=cold?0:eio(prog(t,TL.ans,TL.ans+0.5)),num=lastp?(fr>=0.5?Math.round(p.share)+'%':'?%'):Math.round(p.share*st[k].num)+'%';
  const ym=(p.b0+p.b1)/2+24,x=XR1+18,lg=el(W,'g',{opacity:show});
  const tt=T(lg,x,ym,num,66,lastp?C.ink:p.ink,'start',800),w=tt.getComputedTextLength();
  if(lastp){lg.setAttribute('transform',`translate(0 ${ym-22}) scale(1 ${Math.max(0.001,Math.abs(Math.cos(Math.PI*fr))).toFixed(3)}) translate(0 ${-(ym-22)})`);
   if(fr>=0.5)lg.insertBefore(el(lg,'rect',{x:x-8,y:ym-26,width:w+16,height:30,fill:C.gold}),tt)}});
 {const k=eo(prog(t,TL.ans+0.6,TL.ans+1.1));if(k>0){const s=T(el(g,'g',{opacity:k}),540,1570,D.source,22,'#444','middle',500);const l=s.getComputedTextLength();if(l>900)s.setAttribute('font-size',(22*900/l).toFixed(1))}}
}
</script></body></html>
