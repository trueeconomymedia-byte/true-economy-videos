<!doctype html><html><head><meta charset="utf-8">
<!-- True Economy "IF IT WERE 100" animation style (TEST, 22 Nov 2026; not approved yet). Driven by hundred_render.js.
     100 dots (one each) pour into a grid, then each group drops into its slice of a tall box that stands for the whole
     (e.g. all household wealth): the slice's height is the group's share, so a big group in a thin slice is visibly
     crammed and a small group in a tall slice floats. The last group splits and its final piece is the gold reveal.
     Transparent page: the card paper + printed-ink finish is added by scripts/anim_shared/ink_pipe.py. -->
<style>
@font-face{font-family:'Lora';font-weight:700;src:url('../assets/Lora-Bold.ttf')}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{width:1080px;height:1920px;position:relative}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="stage"><svg id="sv" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const C={blue:'#3670D0',lblue:'#B3C9ED',red:'#D94437',lred:'#F2C4BC',gold:'#FACB3A',ink:'#111111',paper:'#FBF8F1',grey:'#5A554B',line:'#CFC8B8'};
const NS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,p)=>a+(b-a)*p;
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function T(p,x,y,s,size,fill,anchor,w){return el(p,'text',{x,y,'font-family':'Inter','font-weight':w||800,'font-size':size,fill,'text-anchor':anchor||'middle'},s)}
// shared SAFE title zone (same as every Animated Shorts series): baselines 395/490; all content inside x 60-1020
const T1=395,T2=490;
function headline(g,l1,l2,mark){
 const hs=86, mk=el(g,'rect',{fill:C.gold});
 const t1=el(g,'text',{x:540,y:T1,'text-anchor':'middle','font-family':'Lora','font-weight':700,'font-size':hs,fill:C.ink},l1);
 const t2=el(g,'text',{x:540,y:T2,'text-anchor':'middle','font-family':'Lora','font-weight':700,'font-size':hs,fill:C.ink},l2);
 const w=Math.max(t1.getComputedTextLength(),t2.getComputedTextLength());
 if(w>900){const f=Math.floor(hs*900/w);t1.setAttribute('font-size',f);t2.setAttribute('font-size',f)}
 const in1=l1.includes(mark),tx=in1?t1:t2,line=in1?l1:l2,i0=line.indexOf(mark),fs=+tx.getAttribute('font-size');
 const xs=tx.getStartPositionOfChar(i0).x,xe=tx.getEndPositionOfChar(i0+mark.length-1).x;
 Object.entries({x:xs-6,width:xe-xs+12,y:(in1?T1:T2)-Math.round(fs*.4),height:Math.round(fs*.47)}).forEach(([k,v])=>mk.setAttribute(k,v));
}
// ---- layout: the box (= the whole) and the opening grid inside it ----
const BX0=340,BX1=1010,BY0=600,BY1=1540,BCX=(BX0+BX1)/2,BH=BY1-BY0,R=12,GP=56,GCY=1000;
let D,TL,DOTS,SL;
function rowsIn(n,x0,x1,y0,y1,maxPitch){   // lay n dots out in tidy rows inside a slice
 const w=x1-x0-2*R-16,h=y1-y0;let best=null;
 for(let rows=1;rows<=12;rows++){const per=Math.ceil(n/rows),px=per>1?Math.min(maxPitch,w/(per-1)):0,py=h/rows;
  if(per>1&&px<2*R+2)continue;if(py<2*R+2&&rows>1)continue;const score=Math.abs(Math.log((px||maxPitch)/Math.min(py,maxPitch)));
  if(!best||score<best.score)best={rows,per,px,py,score}}
 const out=[];for(let i=0;i<n;i++){const r=Math.floor(i/best.per),k=i%best.per,inRow=Math.min(best.per,n-r*best.per);
  out.push([BCX+(k-(inRow-1)/2)*best.px,y0+best.py*(r+.5)])}
 return out}
function BUILD(d){
 D=d;const G=D.groups;               // play order: G[0] first ... last group = the one that splits; shown bottom -> top
 // slices, stacked from the bottom in play order; the last group's two parts sit at the top (reveal part on top)
 const last=G[G.length-1],parts=[...G.slice(0,-1),...last.split];let y=BY1;SL=[];
 for(const p of parts){const h=BH*p.share/100;SL.push({...p,y0:y-h,y1:y});y-=h}
 const comb={name:last.name,n:last.n,share:last.share,y0:BY0,y1:SL[G.length-2].y0};
 // dots: grid rows from the BOTTOM belong to the first group, so each group falls from where it already sits
 DOTS=[];let idx=0;const order=[];for(const p of parts)for(let k=0;k<p.n;k++)order.push(parts.indexOf(p));
 for(let i=0;i<100;i++){const r=9-Math.floor(i/10),c=i%10;DOTS.push({i,gx:BCX+(c-4.5)*GP,gy:GCY+(r-4.5)*GP,s:order[i],seed:((i*7919)%97)/97})}
 SL.forEach((s,si)=>{const ds=DOTS.filter(o=>o.s===si),pos=rowsIn(s.n,BX0,BX1,s.y0,s.y1,si===0?40:64);ds.forEach((o,k)=>{o.tx=pos[k][0];o.ty=pos[k][1]})});
 {const ds=DOTS.filter(o=>o.s>=G.length-1),pos=rowsIn(last.n,BX0,BX1,comb.y0,comb.y1,64);ds.forEach((o,k)=>{o.cx=pos[k][0];o.cy=pos[k][1]})}
 // timeline: rain in -> box -> one group at a time -> last group lands as one -> splits -> hold on "?" -> gold reveal
 let t=3.0;TL={rain:[0,2.3],box:[3.0,4.0],grp:[],zoom:[2.0,3.4]};
 for(let gi=0;gi<G.length-1;gi++){TL.grp.push({a:t+0.9,land:t+2.5,num:[t+2.4,t+3.5]});t+=5.0}
 TL.comb={a:t+0.9,land:t+2.4,num:[t+2.3,t+3.4]};t+=4.6;
 TL.split={a:t+0.4,land:t+2.0,num:[t+1.9,t+3.0]};t+=3.9;
 TL.hold=t;TL.ans=t+1.9;TL.end=TL.ans+4.2;TL.comb_=comb;
 const lands=[...TL.grp.map(g=>[g.land,1.0]),[TL.comb.land,0.8],[TL.split.land,0.8]];
 window.BEATS={total:TL.end,cold:0,rewind:null,ticks:[],patter:[[0.05,2.3,60,0.10],...TL.grp.map((g,i)=>[g.a,g.land,Math.round(G[i].n*0.8),0.10]),[TL.comb.a,TL.comb.land,10,0.10],[TL.split.a,TL.split.land,9,0.10]],
  rolls:[...TL.grp.map(g=>[g.num[0],g.num[1],9]),[TL.comb.num[0],TL.comb.num[1],9],[TL.split.num[0],TL.split.num[1],9]],
  glides:[[TL.zoom[0],1.4]],swells:[[TL.grp[0].land,1.4]],lands,notes:[[TL.box[1]-0.2,69]],hold:TL.hold,reveal:TL.ans,
  qa:[0.03,1.2,3.2,TL.grp[0].land+1.2,TL.grp[TL.grp.length-1].land+1.2,TL.comb.land+1.2,TL.split.land+1.3,TL.hold+1.2,TL.ans+2],thumb_ms:33};
}
function setTime(t){FRAME(t,{})}
function tease(){FRAME(TL.hold+1.2,{})}
function answer(){FRAME(TL.end-0.05,{})}
function FRAME(t,o){
 const sv=document.getElementById('sv');sv.innerHTML='';const g=el(sv,'g',{});const G=D.groups,nG=G.length;
 const ans=prog(t,TL.ans,TL.ans+0.45);
 headline(el(g,'g',{opacity:1-prog(t,TL.ans,TL.ans+0.35)}),...D.headline_q);
 headline(el(g,'g',{opacity:prog(t,TL.ans+0.1,TL.ans+0.5)}),...D.headline_a);
 // camera: the grid opens big (1.5x) and never sits still: it eases back to the full box as the box draws in
 const z=1+0.5*(1-eio(prog(t,TL.zoom[0],TL.zoom[1])))+0.05*(1-eo(prog(t,0,TL.zoom[0])));
 const sy=mix(1040,(BY0+BY1)/2,eio(prog(t,TL.zoom[0],TL.zoom[1]))),cy=mix(GCY,(BY0+BY1)/2,eio(prog(t,TL.zoom[0],TL.zoom[1]))),cx=mix(BCX,540,eio(prog(t,TL.zoom[0],TL.zoom[1])));
 const wc=el(g,'clipPath',{id:'wc'});el(wc,'rect',{x:0,y:548,width:1080,height:1372});const WC=el(g,'g',{'clip-path':'url(#wc)'});
 const W=el(WC,'g',{transform:`translate(540 ${sy}) scale(${z}) translate(${-cx} ${-cy})`});
 // the box = the whole
 const bp=eo(prog(t,TL.box[0],TL.box[1]));
 if(bp>0){const per=2*(BX1-BX0+BH);el(W,'rect',{x:BX0,y:BY0,width:BX1-BX0,height:BH,fill:'none',stroke:C.ink,'stroke-width':4,'stroke-dasharray':per,'stroke-dashoffset':per*(1-bp)});
  const cap=el(W,'g',{opacity:eo(prog(t,TL.box[0]+0.5,TL.box[1]+0.2))});T(cap,BX1,BY0-16,D.box_label,24,C.grey,'end',700)}
 // slices: light fill wipes in and the share counts up as each group lands
 const state=SL.map((s,si)=>{const isLast=si>=nG-1,tl=isLast?TL.split:TL.grp[si];return {s,si,isLast,tl,p:eo(prog(t,tl.land-0.25,tl.land+0.45)),num:prog(t,tl.num[0],tl.num[1])}});
 const reveal=SL.length-1;
 const label=(grp,y0,y1,name,share,col,k,numP,hidden,goldBox)=>{if(k<=0)return;const lg=el(grp,'g',{opacity:k}),ym=Math.min((y0+y1)/2,BY1-52);
  const txt=hidden?'?%':Math.round(share*eo(numP))+'%';
  if(goldBox){const tt=T(lg,318,ym+14,txt,64,C.ink,'end',800),w=tt.getComputedTextLength();lg.insertBefore(el(lg,'rect',{x:318-w-10,y:ym-12,width:w+20,height:30,fill:C.gold}),tt)}
  else T(lg,318,ym+14,txt,64,col,'end',800);
  T(lg,318,ym+44,name,24,C.ink,'end',700);
  el(lg,'path',{d:`M${BX0-2} ${y0+3} L${BX0-12} ${y0+3} L${BX0-12} ${y1-3} L${BX0-2} ${y1-3}`,fill:'none',stroke:C.ink,'stroke-width':3})};
 for(const st of state){const s=st.s,col=s.colour==='red'?C.lred:C.lblue;
  if(st.si===reveal){ if(ans>0)el(W,'rect',{x:BX0+2,y:s.y0+2,width:(BX1-BX0-4)*eo(ans),height:s.y1-s.y0-2,fill:C.gold});
   const k=eo(prog(t,TL.split.land-0.1,TL.split.land+0.4));label(W,s.y0,s.y1,s.name,s.share,C.ink,k,prog(t,TL.ans,TL.ans+0.7),ans<=0,ans>0);
   if(k>0)el(W,'line',{x1:BX0,x2:BX0+(BX1-BX0)*k,y1:s.y1,y2:s.y1,stroke:C.ink,'stroke-width':3});continue}
  if(st.p>0){el(W,'rect',{x:BX0+2,y:s.y0,width:(BX1-BX0-4)*st.p,height:s.y1-s.y0-2,fill:col});
   if(st.si>0||true)el(W,'line',{x1:BX0,x2:BX0+(BX1-BX0)*st.p,y1:s.y0,y2:s.y0,stroke:C.ink,'stroke-width':3});
   label(W,s.y0,s.y1,s.name,s.share,s.colour==='red'?C.red:C.blue,st.p,st.num,false,false)}}
 // the last group first lands as ONE block with its combined share, then splits
 {const cb=TL.comb_,k=eo(prog(t,TL.comb.land-0.25,TL.comb.land+0.45))*(1-eo(prog(t,TL.split.a,TL.split.a+0.5)));
  if(k>0){el(W,'rect',{x:BX0+2,y:cb.y0+2,width:(BX1-BX0-4),height:cb.y1-cb.y0-4,fill:C.lblue,opacity:k});label(W,cb.y0,cb.y1,cb.name,cb.share,C.blue,k,prog(t,TL.comb.num[0],TL.comb.num[1]),false,false)}}
 // dots
 for(const o of DOTS){
  // rain into the grid: every dot is already falling at t=0 (staggered), no still first frame
  const r0=TL.rain[0]-0.5+o.seed*0.9+(9-(o.gy-GCY)/GP-4.5)*0.07,rp=eo(prog(t,r0,r0+1.25));
  const by=mix(o.gy-760-o.seed*260,o.gy,rp);let x=o.gx,y=by,col=C.blue,rr=R,op=1;
  const isLast=o.s>=nG-1;
  if(!isLast){const tl=TL.grp[o.s],d=tl.a+o.seed*(tl.land-tl.a-0.75),p=eio(prog(t,d,d+0.75));x=mix(o.gx,o.tx,p);y=mix(by,o.ty,p)+Math.sin(Math.PI*p)*-18;
   if(SL[o.s].colour==='red'&&t>tl.a-0.3)col=C.red}
  else{const d=TL.comb.a+o.seed*0.6,p=eio(prog(t,d,d+0.85));x=mix(o.gx,o.cx,p);y=mix(by,o.cy,p);
   const d2=TL.split.a+o.seed*0.6,p2=eio(prog(t,d2,d2+0.95));x=mix(x,o.tx,p2);y=mix(y,o.ty,p2);
   if(o.s===reveal){const pu=t>TL.split.land&&ans<=0?1+0.22*(0.5-0.5*Math.cos((t-TL.split.land)*Math.PI*1.6)):1;rr=R*pu*(1+0.5*Math.sin(Math.PI*clamp(ans)));if(ans>0)col=C.ink}}
  // finished groups step back a little so the eye follows the group that is moving
  if(!isLast){const tl=TL.grp[o.s];op=1}
  el(W,'circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:rr.toFixed(1),fill:col,opacity:op.toFixed(2)})}
 // open question inside the box: how much is still unclaimed (hidden once the last group lands, so the reveal stays a surprise)
 {let left=100;TL.grp.forEach((tl,i)=>{left-=G[i].share*eo(prog(t,tl.num[0],tl.num[1]))});
  const k=eo(prog(t,TL.box[1]-0.2,TL.box[1]+0.3))*(1-eo(prog(t,TL.comb.a,TL.comb.a+0.4)));
  if(k>0){const ug=el(W,'g',{opacity:k});T(ug,BX1-18,BY0+50,Math.round(left)+'%',44,C.ink,'end',800);T(ug,BX1-18,BY0+80,'still unclaimed',22,C.grey,'end',700)}}
 // unit note under the opening grid, source on the final frame
 {const k=eo(prog(t,0.5,1.1))*(1-eo(prog(t,TL.grp[0].a-0.4,TL.grp[0].a)));if(k>0)T(el(W,'g',{opacity:k}),BCX,GCY+5.5*GP+26,D.unit_note,26,C.ink,'middle',700)}
 {const k=eo(prog(t,TL.ans+0.6,TL.ans+1.1));if(k>0){const s=T(el(g,'g',{opacity:k}),540,1590,D.source,22,'#444','middle',500);const l=s.getComputedTextLength();if(l>900)s.setAttribute('font-size',(22*900/l).toFixed(1))}}
}
</script></body></html>
