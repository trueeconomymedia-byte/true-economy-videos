<script>
function BUILD(D){
const NS='http://www.w3.org/2000/svg';

const $=id=>document.getElementById(id);

 $('tex1').style.display='none';$('tex2').style.display='none';}
else{$('tex1').src=D.tex1;$('tex2').src=D.tex2;}
const MASKFADE=!!D.bg_image;   // textured paper image: fade the chart itself (no flat colour bands over the texture)
const C={blue:'#3670D0',lblue:'#B3C9ED',red:'#D94437',lred:'#F2C4BC',gold:'#FACB3A',lgold:'#FBE3A0',dgold:'#E0A800',
 teal:'#249972',lteal:'#B2DCCE',ink:'#161616',paper:'#F2EFE8'};
const W=$('world'),DEFS=$('defs');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};

const prog=(t,a,b)=>clamp((t-a)/(b-a));
// ---------- generic model (funnel_short.py turns company data into this) ----------
// D.fmt {prefix,suffix,decimals,small}: "$"+"B" -> $92.3B (under 1 -> $380M); "£","",0 -> £35,000; "£","",2 -> £1.38
const F=Object.assign({prefix:'$',suffix:'B',decimals:1,small:'M'},D.fmt||{});
const money=v=>{const a=Math.abs(v);
 if(F.suffix==='B'&&a<1&&F.small==='M')return F.prefix+Math.round(a*1000)+'M';
 return F.prefix+a.toLocaleString('en-GB',{minimumFractionDigits:F.decimals,maximumFractionDigits:F.decimals})+F.suffix};
const rev=D.start.value, ni=D.steps[D.steps.length-1].val;
const share=v=>{const sh=D.share;if(!sh)return null;
 if(sh.style==='per')return Math.round(v/rev*100)+sh.sym+' per '+sh.of;
 if(sh.style==='pct')return Math.round(v/rev*100)+'% of '+sh.of;return null};
const steps=D.steps.map((s,i)=>Object.assign({},s,{final:i===D.steps.length-1,widthAmt:s.width_amt}));
window.NSTEPS=steps.length;

// ---------- geometry ----------
// SAFE layout (user, 11 Nov 2026): everything inside x 60-1020 (their width guide; Shorts zoom in), title inside the 4:5
// feed crop (y 285-1635) and below every app's top bar, nothing important below y 1600 (captions/UI) or in the right 120 px
// of the lower half (like/comment buttons). D.safe=false gives the original layout.
const SAFE=D.safe!==false, CW=SAFE?380:425;
const VMAX=Math.max(rev,...steps.map(s=>s.val)),WMAX=CW*rev/VMAX,k=CW/VMAX,L=SAFE?310:255,BAR=16,Yt=-40,Y0=520,DY=SAFE?400:440,D_=SAFE?330:360,RX=SAFE?725:715,LX=SAFE?290:235;
const MX0=SAFE?60:0,MX1=SAFE?1020:1080, T1=SAFE?395:205, T2=SAFE?490:300, PY=SAFE?525:345, TOPF=SAFE?645:470, BOTF=SAFE?1545:1640;
const Ys=[Y0];steps.forEach((s,i)=>Ys.push(Y0+DY*(i+1)));
const width=v=>v*k;
const HO=0;   // the title NEVER moves (user rule: same place every episode, max 2 lines); a logo sits beside the counter

// ---------- timeline ----------
const COLD=D.cold?1.6:0;
const STEP0=5.0,SP=steps.length<=4?6.0:5.0;
steps.forEach((s,j)=>{s.a=STEP0+SP*j;s.b=s.a+2.5});
const last=steps[steps.length-1];
const KT=last.b+1.3, PULL0=KT+3.2, PULL1=KT+5.9, END=KT+9.2;
const POUR0=[-2.5,3.5], REVBAR=3.45;

// ---------- ribbons ----------
const ribbons=[];let rid=0;

 el(g,'stop',{offset:0,'stop-color':'#fff'});el(g,'stop',{offset:1,'stop-color':'#000'});
 const m=el(DEFS,'mask',{id:'m'+id,maskUnits:'userSpaceOnUse',x:-400,y:-600,width:1900,height:5000});
 el(m,'rect',{x:-400,y:-600,width:1900,height:5000,fill:`url(#g${id})`});
 const grp=el(W,'g',{mask:`url(#m${id})`});
 el(grp,'path',{d:`M${a0} ${ya} C${a0} ${ym} ${b0} ${ym} ${b0} ${yb} L${b1} ${yb} C${b1} ${ym} ${a1} ${ym} ${a1} ${ya}Z`,fill});

const nd=w=>Math.max(3,Math.round(w/18));
// funnel mouth: segments spread over the full width
let segs=(D.segments&&D.segments.length)?D.segments.map(s=>({lines:s.lines,value:s.value})):[{lines:[D.start.label],value:rev}];

segs.forEach((s,i)=>{const wt=(MX1-MX0)*s.value/segTot,wb=WMAX*s.value/segTot,g1=i>0?3:0,g2=i<segs.length-1?3:0;

 segX.push([xt+g1,xt+wt-g2]);xt+=wt;xb+=wb;});

steps.forEach((s,j)=>{
 const y0=Ys[j],y1=Ys[j+1],last=!!s.final;

 }else{

  ribbon(cur[0],cur[1],y0+BAR,L,cur[1]-cur[0]+L,y1,mainFill,mainDash,nd(cur[1]-cur[0]),3+j*8,s.a,s.b);
  const S=[RX,RX+w],sy=y0+130;
  ribbon(S[0],S[1],sy+BAR,L+cur[1]-cur[0],L+cur[1]-cur[0]+w,y1,C.lteal,C.teal,nd(w)+2,7+j*8,s.a-.2,s.b-.1);

});

});

const keptRect=el(W,'rect',{x:L-10,y:YN+44,width:0,height:100,fill:C.gold,rx:4});
const keptTxt=T(W,L+240,YN+116,D.final.text,66,C.ink);

const KW=Math.max(500,keptTxt.getComputedTextLength()+60);keptRect.setAttribute('x',L+240-KW/2);

 const t2=el(g,'text',{x:540,y:T2+HO,'text-anchor':'middle','font-family':'Lora','font-weight':700,'font-size':hs,fill:C.ink},l2);

 const TW=SAFE?900:1000;if(wmax>TW){hs=Math.floor(hs*TW/wmax);t1.setAttribute('font-size',hs);t2.setAttribute('font-size',hs)}

 mk.setAttribute('x',xs-6);mk.setAttribute('width',xe-xs+12);mk.setAttribute('y',(inL1?T1:T2)+HO-Math.round(hs*.4));mk.setAttribute('height',Math.round(hs*.47));
}
headline($('hq'),...D.headline_q);   // the title slides up and shrinks once the chart starts moving (user 11 Nov 2026)
headline($('ha'),...D.headline_a);
const PX=D.logo?490:380;   // with a logo: [logo 200x72][20 gap][counter 320] centred as one row under the title
if(D.logo){el($('logo'),'image',{href:D.logo,x:270,y:PY,width:200,height:72,preserveAspectRatio:'xMidYMid meet'})}
// MONEY BAR (user 11 Nov 2026, replaces the black pill): the running amount in big ink type with a bar under it;
// gold = what is still left, light red (the colour of the cost streams) = what the costs have taken so far, so the
// gold shrinks as the costs add up (user 11 Nov 2026: starts gold, the lost part turns red).
const MB={x0:320,x1:760,h:30},pillG=el($('pill'),'g',{});
const pillT=el(pillG,'text',{x:540,y:0,'text-anchor':'middle','font-family':'Inter','font-weight':800,'font-size':52,fill:C.ink,style:'font-variant-numeric:tabular-nums'},'');
const pillW=el(pillG,'tspan',{});
const mbRed=el(pillG,'rect',{x:MB.x0,y:0,width:MB.x1-MB.x0,height:MB.h,fill:D.bar_red==='dark'?C.red:C.lred});
const mbGrn=el(pillG,'rect',{x:MB.x0,y:0,width:MB.x1-MB.x0,height:MB.h,fill:C.gold});
el($('src'),'text',{x:540,y:SAFE?1590:1712,'text-anchor':'middle','font-family':'Inter','font-weight':500,'font-size':22,fill:'#444'},D.source);

// ---------- camera ----------
const SY=(SAFE?1180:1080)+HO*.6;
const view=j=>(Ys[j]+Ys[j+1])/2+40;
// wide shot: fit the whole world between the header and the caption-safe line
const top=Yt-10, bot=YN+215, availTop=(SAFE?635:430)+HO, availBot=SAFE?1560:1690;
const WS=Math.min(.75,(availBot-availTop)/(bot-top)), WCY=(top+bot)/2, WSY=(availTop+availBot)/2;
const CAM=D.title_mode==='fade'?[[0,530,1,SY],[1.2,560,1,SY],[4.0,view(0)-12,1,SY]]:[[0,540,1,SY],[.8,540,1,SY],[4.3,view(0)-12,1,SY]];
// fade mode: after the zoom-in the camera drifts slowly over the top of the funnel for 1.5 s (segment labels readable,
// never still), then the main move down to revenue; the title fade and money bar follow that main move
steps.forEach((s,j)=>{CAM.push([s.b+1.8,view(j),1,SY]);if(j<steps.length-1)CAM.push([s.b+4.0,view(j+1)-12,1,SY])});

CAM.push([PULL1,WCY,WS,WSY],[END,WCY,WS*1.007,WSY]);
// fix: holds must start where the previous move ended
for(let i=1;i<CAM.length;i++){if(CAM[i][0]<=CAM[i-1][0])CAM[i][0]=CAM[i-1][0]+.01}

function ypath(t){   // fade mode: slow drift over the segment labels, then a Hermite curve into the first stage (no stall)

 return (2*u3-3*u2+1)*YP[1]+(u3-2*u2+u)*VD*T_+(-2*u3+3*u2)*YP[2]}

// segment labels so they stay put and readable, then the camera curves straight on into the first stage
const ZA=.08,YA=Yt+60;
function zs(t){const u=Math.min(1,t/CAM[1][0]);return 1-ZA*(1-u)*(1-u)}
function cam(t){if(D.title_mode==='fade'&&t<CAM[2][0]){const s_=zs(t);return [(ypath(t)+YA*(s_-1))/s_,s_,SY]}let i=0;while(i<CAM.length-2&&t>=CAM[i+1][0])i++;const a=CAM[i],b=CAM[i+1],u_=prog(t,a[0],b[0]),p=D.title_mode==='fade'&&i===0?u_:D.title_mode==='fade'&&i===1?.15*u_+.85*eio(u_):eio(u_);
 return [a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p,a[3]+(b[3]-a[3])*p]}
const ROLL=[[0,rev]];steps.forEach(s=>{ROLL.push([s.b+.05,ROLL[ROLL.length-1][1]],[s.b+1.05,s.val])});ROLL.push([999,ni]);
function counter(t){let i=0;while(i<ROLL.length-2&&t>=ROLL[i+1][0])i++;const a=ROLL[i],b=ROLL[i+1];return a[1]+(b[1]-a[1])*eq(prog(t,a[0],b[0]))}

function draw(t,o){o=o||{};
 for(const r of ribbons){
  const p=o.retract!=null?eq(prog(t,r.ta,r.tb))*(1-o.retract)+0*(o.retract):eq(prog(t,r.ta,r.tb));
  const front=r.ya+(r.yb+62-r.ya)*p;
  r.g.setAttribute('y1',front-60);r.g.setAttribute('y2',front);
  for(const d of r.ds){
   // particles are released from the TOP of each stream when it opens and swarm down, then keep flowing (user 11 Nov 2026)
   const q=(t-Math.max(r.ta,0))*0.3-d.ph;if(q<0){d.e.setAttribute('opacity',0);continue}

   const xa=r.a0+d.u*(r.a1-r.a0),xb=r.b0+d.u*(r.b1-r.b0);
   const bx=q=>{const m=1-q;return m*m*m*xa+3*m*m*q*xa+3*m*q*q*xb+q*q*q*xb};
   const by=q=>{const m=1-q;return m*m*m*r.ya+3*m*m*q*r.ym+3*m*q*q*r.ym+q*q*q*r.yb};
   const op=Math.min(1,tt/.08,(.94-tt)/.08)*.6;
   d.e.setAttribute('x1',bx(tt));d.e.setAttribute('y1',by(tt));d.e.setAttribute('x2',bx(tt+.04));d.e.setAttribute('y2',by(tt+.04));d.e.setAttribute('opacity',op.toFixed(3));
  }}
 for(const a of anims){
  if(a.kind==='bar'){const p=eo(prog(t,a.t,a.t+.4));a.e.setAttribute('width',a.w*p)}
  else{const p=eo(prog(t,a.t,a.t+.45));a.e.setAttribute('opacity',p);a.e.setAttribute('transform',`translate(0 ${14*(1-p)})`)}
 }
 keptRect.setAttribute('width',KW*eo(prog(t,KT,KT+.4)));
 {const p=eo(prog(t,KT+.2,KT+.6));keptTxt.setAttribute('opacity',p);keptTxt.setAttribute('transform',`translate(${-18*(1-p)} 0)`)}
 {const p=eo(prog(t,KT+.9,KT+1.4));keptSub.setAttribute('opacity',p);keptSub.setAttribute('transform',`translate(0 ${12*(1-p)})`)}
